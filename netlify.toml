[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "26" }

# The app uses HashRouter, so deep links resolve client-side and no SPA fallback is needed.
# The POS API is called directly on each tenant host (CORS allows any origin), so there is no proxy.
#
# Sign-in is tenant ID + slug + token typed by the operator; no secret is compiled into the bundle.
# Only the tenant host list (VITE_POS_TENANTS / VITE_TENANT_HOST_TEMPLATE) is build-time config.
